name: Native Linux build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libopengl0 libxcb-cursor0 libxkbcommon-x11-0 libdbus-1-3 libpulse0
      - run: python -m pip install -r requirements-build.txt
      - run: python -m pytest -q
      - run: python build.py
      - name: Launch packaged native app
        shell: bash
        run: |
          mkdir -p validation
          dist/MakkSocial/MakkSocial --smoke-test validation/native-smoke.png
          test -s validation/native-smoke.png
      - uses: actions/upload-artifact@v7
        with:
          name: MakkSocial-Linux
          path: |
            release/*
            validation/*.png
          if-no-files-found: error
          retention-days: 14
